<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%" role="img" aria-label="Rodrigo Souza Feliciano - Online Curriculum &amp; Resume">
  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="cvAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="cvGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.5"/>
    </pattern>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      @keyframes pulseDot {
        0%, 100% { r: 4.5px; opacity: 1; }
        50% { r: 6.5px; opacity: 0.5; }
      }
      @keyframes dashSlide {
        to { stroke-dashoffset: -40; }
      }
      .dot-live { animation: pulseDot 2s ease-in-out infinite; }
      .anim-border { stroke-dasharray: 10 6; animation: dashSlide 2s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="220" rx="14" fill="url(#cvBg)"/>
  <rect width="1200" height="220" rx="14" fill="url(#cvGrid)"/>
  <rect x="1.5" y="1.5" width="1197" height="217" rx="13" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#cvAccent)"/>

  <!-- Left Content -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="360" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle class="dot-live" cx="16" cy="13" r="4.5" fill="#10B981"/>
    <text x="30" y="17" class="font-mono" font-size="11" fill="#94A3B8" letter-spacing="0.6">BILINGUAL CURRICULUM VITAE · PT-BR &amp; EN-US</text>

    <text x="0" y="68" class="font-sans" font-size="36" font-weight="800" fill="#F8FAFC" letter-spacing="-0.6">
      Rodrigo Souza Feliciano
    </text>

    <text x="0" y="100" class="font-sans" font-size="17.5" font-weight="600" fill="url(#cvAccent)">
      Desenvolvedor Full Stack · Full Stack Software Developer
    </text>

    <text x="0" y="132" class="font-mono" font-size="12.5" fill="#94A3B8">
      React · Next.js · TypeScript · Node.js (Koa/Express) · PostgreSQL · Redis · Docker · React Native · QA
    </text>

    <text x="0" y="158" class="font-sans" font-size="13" fill="#64748B">
      Laguna, SC, Brazil (UTC-3) · Available for 100% Remote Roles (Brazil &amp; International)
    </text>
  </g>

  <!-- Right Badge Card -->
  <g transform="translate(910, 44)">
    <rect width="242" height="132" rx="12" fill="#0B1120" stroke="#1E293B" stroke-width="1.5"/>
    <rect class="anim-border" width="242" height="132" rx="12" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="121" y="34" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1">VERIFIED PROFILE</text>
    <text x="121" y="62" text-anchor="middle" class="font-sans" font-size="14" font-weight="700" fill="#F8FAFC">ATS-Validated Resumes</text>
    <text x="121" y="84" text-anchor="middle" class="font-mono" font-size="11.5" fill="#10B981">PDF &amp; DOCX Ready</text>
    <text x="121" y="108" text-anchor="middle" class="font-sans" font-size="11.5" fill="#64748B">Clean Architecture · Zero-Defect QA</text>
  </g>
</svg>
